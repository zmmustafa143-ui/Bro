<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | DelishDrop</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar">
        <a href="index.html" class="logo-text" id="shop-logo">DelishDrop</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="menu.html">Menu</a></li>
            <li><a href="delivery-areas.html">Delivery Areas</a></li>
            <li><a href="contact.html">Contact Us</a></li>
        </ul>
        <a href="cart.html" class="cart-icon">🛒 Cart (<span id="cart-count">0</span>)</a>
    </nav>

    <!-- Cart Section -->
    <section class="cart-section">
        <h2>Your Shopping Cart</h2>
        
        <div class="cart-container" id="cart-wrapper">
            <!-- Left Side: Cart Items -->
            <div class="cart-items">
                <table class="cart-table">
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Price</th>
                            <th>Quantity</th>
                            <th>Total</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="cart-table-body">
                        <!-- Dynamically Injected by JS -->
                        <tr><td colspan="5" style="text-align: center;">Loading your cart...</td></tr>
                    </tbody>
                </table>
                <div style="margin-top: 20px;">
                    <button class="filter-btn" id="clear-cart-btn" style="color: red; border-color: red; display: none;">Clear Cart</button>
                </div>
            </div>

            <!-- Right Side: Summary -->
            <div class="cart-summary" id="cart-summary-box">
                <h3 style="margin-bottom: 20px;">Order Summary</h3>
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="summary-subtotal">Rs. 0</span>
                </div>
                <div class="summary-row">
                    <span>Delivery</span>
                    <span style="font-size: 0.9rem; color: #a0aab5;">(Calculated at checkout)</span>
                </div>
                <div class="summary-row summary-total">
                    <span>Total</span>
                    <span id="summary-total">Rs. 0</span>
                </div>
                <a href="checkout.html" class="btn-primary checkout-btn" id="checkout-btn">Proceed to Checkout</a>
                <a href="menu.html" class="filter-btn" style="width: 100%; display: block; text-align: center; margin-top: 10px; color: var(--text-light); border-color: rgba(255,255,255,0.2);">Continue Shopping</a>
            </div>
        </div>
    </section>

    <!-- JavaScript Files -->
    <script src="js/app.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
